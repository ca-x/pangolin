name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify stable release tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$version"
          test "$(node -p "require('./web/package.json').version")" = "$version"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

  web-assets:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 26.9.0
      - run: npm install --global pnpm@11.0.0 --ignore-scripts
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: web-assets
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, extension: "", archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, extension: "", archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, extension: "", archive: tar.gz }
          - { os: macos-15, target: aarch64-apple-darwin, extension: "", archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, extension: .exe, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          package="pangolin-${TARGET}"
          mkdir -p "dist/${package}"
          cp "target/${TARGET}/release/pangolin${EXTENSION}" README.md LICENSE .env.example "dist/${package}/"
          if [[ "$ARCHIVE" == "zip" ]]; then
            (cd dist && 7z a -tzip "${package}.zip" "$package" >/dev/null)
          else
            tar -C dist -czf "dist/${package}.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pangolin-${{ matrix.target }}
          path: dist/pangolin-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pangolin-*
          path: dist
          merge-multiple: true
      - run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f -name 'pangolin-*' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
