[package]
name = "pangolin"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A self-hosted AI API gateway and observability console"
repository = "https://github.com/ca-x/pangolin"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.22.1"
blake3 = "1.8.3"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
futures-util = "0.3.32"
http = "1.4.0"
ipnet = "2.11.0"
mime_guess = "2.0.5"
oauth2 = { version = "5.0.0", default-features = false }
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
rust-embed = "8.12.0"
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-time", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-full", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
