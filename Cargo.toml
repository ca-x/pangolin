[package]
name = "pangolin"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A self-hosted AI API gateway and observability console"
repository = "https://github.com/ca-x/pangolin"

[features]
redis-affinity = ["dep:redis"]

[dependencies]
anyhow = "1.0.100"
aimux-provider-utils = { git = "https://github.com/arcships/aimux.git", rev = "4c0b40c54d689439937155d2c36720a4b3c7454d", default-features = false }
aimux-stream = { git = "https://github.com/arcships/aimux.git", rev = "4c0b40c54d689439937155d2c36720a4b3c7454d" }
async-stream = "0.3.6"
async-trait = "0.1"
aws-config = { version = "1.12", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = "1.3"
aws-sigv4 = "1.5"
aws-types = "1.3"
azure_core = "1.1"
azure_identity = "1.0"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["json", "macros", "ws"] }
base64 = "0.22.1"
blake3 = "1.8.3"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
cron = "0.15"
duckdb = { version = "1.10505.0", features = ["bundled"] }
dashmap = "6.1"
eventsource-stream = "0.2"
ed25519-dalek = "2.2"
futures-util = "0.3.32"
governor = "0.10"
gcp_auth = "0.12.7"
http = "1.4.0"
ipnet = "2.11.0"
json-patch = "4.0"
mime_guess = "2.0.5"
multer = "3.1"
moka = { version = "0.12", features = ["sync"] }
models-dev-rs = { version = "0.1.0", default-features = false }
oauth2 = { version = "5.0.0", default-features = false }
object_store = { version = "0.13", features = ["aws", "gcp", "http"] }
rand = "0.9.2"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream", "gzip", "brotli", "deflate", "zstd", "socks"] }
redis = { version = "1.0", default-features = false, features = ["tokio-rustls-comp"], optional = true }
rust-embed = "8.12.0"
rust_decimal = { version = "1.40", default-features = false, features = ["std"] }
rustc-hash = "2.1"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-time", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tempfile = "3.23.0"
tiktoken-rs = "0.12.1"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-full", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"

# The build script reads `web/dist/build.json` to record which console revision
# a binary embeds, so it needs the same JSON parser the runtime uses.
[build-dependencies]
serde_json = "1.0.149"

[dev-dependencies]
aws-lc-rs = { version = "1.18", default-features = false }
flate2 = "1.1"
tokio-tungstenite = "0.29"
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
